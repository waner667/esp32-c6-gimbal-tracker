<svg viewBox="0 0 680 492" width="680" height="492" role="img" xmlns="http://www.w3.org/2000/svg">
<title>PC 侧软件结构与工具链图</title>
<desc>tracker.py 主程序下分视频采集、人脸检测、控制算法、ServoLink 串口四个模块，下方为 preflight.py 与 test_servolink.py 两个串口排查工具，底部给出排查顺序。</desc>
